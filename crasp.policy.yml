id: default-safety
name: Default Safety Policy
version: 0.1.0
rules:
  - id: credential-theft
    description: Assistant must not provide credential theft or exfiltration instructions.
    severity: critical
    target: assistant
    pattern: "steal (browser )?passwords?|credential theft|dump (chrome|firefox|browser|saved) (login|credential|password)|exfiltrat(e|ing) (credentials?|tokens?|cookies?|passwords?|secrets?)|extract (saved|stored|browser) (credentials?|passwords?|tokens?|logins?)|harvest (credentials?|passwords?|auth tokens?)"
    message: "Credential theft guidance detected."

# Exceptions: pre-approve specific file access (hook ask dialogs) or skip
# policy-rule matching in content scans. The 'scan' op must be explicit —
# 'any' covers only hook ops. Excepted files are still scanned for secrets.
# Scan globs resolve relative to the repo root. (.claude/, scenarios/ and other
# default-excluded paths get rule suppression in staged scans automatically.)
exceptions:
  - path: "README.md"
    ops: [scan]
    reason: "Documents the builtin rules; quotes their trigger patterns as examples"
  - path: "CHANGELOG.md"
    ops: [scan]
    reason: "Release notes quote rule patterns and detection examples"
  - path: "src/cli/commands/setup.ts"
    ops: [scan]
    reason: "STARTER_POLICY template quotes the credential-theft pattern"
  - path: "tests/**"
    ops: [scan]
    reason: "Test fixtures deliberately quote rule patterns; secrets still scanned"

secrets:
  allowlist:
    # Suffix of Stripe's public documentation test key, used in test fixtures.
    # Matched as a regex; written without the sk_ prefix so no key-shaped string
    # exists in this file (GitHub push protection flags even fake full keys).
    - "4eC39HqLyjWDarjtT1zdp7dc$"
